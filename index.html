<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Protegido</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-align: center;
            width: 350px;
        }
        input[type="password"] {
            padding: 10px;
            width: 80%;
            margin-bottom: 15px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: #fff;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .hidden {
            display: none;
        }
        #timer {
            font-size: 24px;
            font-weight: bold;
            color: #ff9800;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="login-screen">
            <h2>Ingrese la Contraseña</h2>
            <input type="password" id="password-input" placeholder="Contraseña...">
            <br>
            <button onclick="verificarPassword()">Ingresar</button>
            <p id="error-msg" style="color: #ff5252; display: none;">Contraseña incorrecta</p>
        </div>

        <div id="wait-screen" class="hidden">
            <h2>Por favor, espere...</h2>
            <p>El sistema se está preparando.</p>
            <div id="timer">01:00</div>
        </div>

        <div id="message-screen" class="hidden">
            <h2>Mensaje:</h2>
            <p id="final-message" style="font-size: 18px; line-height: 1.5;"></p>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURACIÓN DE LA CONTRASEÑA
        // ==========================================
        const PASSWORD_SECRETA = "Olikiman"; // <--- CAMBIA ESTO POR LA CONTRASEÑA QUE QUIERAS
        
        // Mensaje final configurado
        const MENSAJE_FINAL = "Desde mi cielo (Alice Sebold) (primera palabra), , Gusanito Gus (primeras 3 letras), -, .-, , aabaa, 109, .., 108, 和";

        let tiempoRestante = 60; // 60 segundos (1 minuto)
        let intervaloTimer = null;

        function verificarPassword() {
            const input = document.getElementById("password-input").value;
            const errorMsg = document.getElementById("error-msg");

            if (input === PASSWORD_SECRETA) {
                document.getElementById("login-screen").classList.add("hidden");
                document.getElementById("wait-screen").classList.remove("hidden");
                iniciarEspera();
            } else {
                errorMsg.style.display = "block";
            }
        }

        function iniciarEspera() {
            const timerDisplay = document.getElementById("timer");
            
            // Escuchar la tecla "w" o "W" para saltar secretamente
            window.addEventListener("keydown", function(event) {
                if (event.key === "w" || event.key === "W") {
                    saltarEspera();
                }
            });

            intervaloTimer = setInterval(() => {
                tiempoRestante--;
                let minutos = Math.floor(tiempoRestante / 60);
                let segundos = tiempoRestante % 60;

                timerDisplay.textContent = 
                    (minutos < 10 ? "0" : "") + minutos + ":" + 
                    (segundos < 10 ? "0" : "") + segundos;

                if (tiempoRestante <= 0) {
                    clearInterval(intervaloTimer);
                    mostrarMensajeFinal();
                }
            }, 1000);
        }

        function saltarEspera() {
            clearInterval(intervaloTimer);
            mostrarMensajeFinal();
        }

        function mostrarMensajeFinal() {
            document.getElementById("wait-screen").classList.add("hidden");
            document.getElementById("message-screen").classList.remove("hidden");
            document.getElementById("final-message").textContent = MENSAJE_FINAL;
        }
    </script>
</body>
</html>
